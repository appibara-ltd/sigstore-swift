# SwiftLint, run in CI as the project's static analyser (static-analysis.yml).
# Style rules are off: the code mirrors sigstore-go's names and structure
# (AGENTS.md), so Go-style short identifiers, long functions and long files
# are intended. The rules kept catch crashes and silent data loss.
included:
  - Sources
excluded:
  - Sources/SigstoreProtobufSpecs/Generated
  - Sources/SigstoreTUF/EmbeddedRoots.swift

disabled_rules:
  - identifier_name
  - type_name
  - line_length
  - cyclomatic_complexity
  - function_body_length
  - function_parameter_count
  - type_body_length
  - file_length
  - large_tuple
  - nesting
  - opening_brace
  - trailing_comma
  - vertical_whitespace
  - shorthand_operator
  - todo
  # Many signatures mirror Go functions or protocol requirements that ignore
  # some arguments.
  - unused_parameter

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional
  - discouraged_optional_boolean
  - unowned_variable_capture
  - legacy_random
  - empty_count
  - contains_over_first_not_nil
  - identical_operands
  - fatal_error_message
  - unhandled_throwing_task

force_try: error
force_cast: error

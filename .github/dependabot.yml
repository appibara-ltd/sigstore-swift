# Mirrors sigstore-go .github/dependabot.yml, with SwiftPM in place of
# gomod. Fuzz/ depends only on this package (by path), so it is not listed.
version: 2
updates:
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

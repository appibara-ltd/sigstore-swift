# Signed releases: when a GitHub release is published, attach the tag's
# source archive and a Sigstore-signed SLSA build provenance attestation
# for it (actions/attest-build-provenance; the bundle is also stored in
# GitHub's attestation API). SwiftPM consumers fetch the tag directly; the
# archive lets anyone verify that a release's source came from this
# repository's workflow:
#
#   gh attestation verify sigstore-swift-X.Y.Z.tar.gz \
#     --repo appibara-ltd/sigstore-swift \
#     --bundle sigstore-swift-X.Y.Z.tar.gz.intoto.jsonl
#
# Run it by hand (workflow_dispatch) to sign an existing release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to sign (e.g. 0.3.0)"
        required: true

permissions: {}

jobs:
  provenance:
    name: Source archive and provenance
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # upload release assets
      id-token: write      # Sigstore keyless signing
      attestations: write  # store the attestation in GitHub
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check tag
        run: |
          case "$TAG" in
            ''|*[!0-9A-Za-z.+-]*) echo "invalid tag: $TAG" >&2; exit 1 ;;
          esac

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Create source archive
        run: |
          git archive --format=tar.gz --prefix="sigstore-swift-${TAG}/" \
            -o "sigstore-swift-${TAG}.tar.gz" "refs/tags/${TAG}"
          sha256sum "sigstore-swift-${TAG}.tar.gz"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sigstore-swift-${{ env.TAG }}.tar.gz

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "sigstore-swift-${TAG}.tar.gz.intoto.jsonl"
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            "sigstore-swift-${TAG}.tar.gz" \
            "sigstore-swift-${TAG}.tar.gz.intoto.jsonl"

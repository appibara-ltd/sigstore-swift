# Dependency review. Mirrors sigstore-go .github/workflows/depsreview.yml,
# with the steps of sigstore/community reusable-dependency-review.yml inlined
# (same severity threshold and denied licenses).
name: Dependency Review

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    name: License and vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0, LGPL-3.0

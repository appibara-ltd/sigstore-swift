# CodeQL. Mirrors sigstore-go .github/workflows/codeql.yml, which analyses
# 'go' and 'actions'. Only 'actions' (the workflows) is analysed here: CodeQL
# supports Swift 5.4-6.3 (github/codeql docs/codeql/reusables/
# supported-versions-compilers.rst) and Package.swift needs tools 6.4. Add
# 'swift' (macOS runner, manual build) once CodeQL supports Swift 6.4.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 10 * * 1"

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: "/language:${{ matrix.language }}"

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Mirrors sigstore-go .github/workflows/build.yml: one build/test job over
  # macOS, Linux and Windows, fail-fast off. Conformance stays Linux-only.
  # Windows deviates: windows-latest (VS 18, MSVC STL 14.52) requires Clang
  # 22+, but Swift 6.4.3 bundles Clang 21 (STL1000). windows-2022's VS 2022
  # toolset accepts it. Back to windows-latest once Swift 6.5 (Clang 23) ships.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-2022]
        include:
          - os: ubuntu-24.04
            container: swift:6.4-noble
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's Xcodes ship Swift 6.3; Package.swift needs tools 6.4.
      # Install the swift.org toolchain with swiftly
      # (https://www.swift.org/install/macos/).
      - name: Install Swift 6.4 (swiftly)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftly.pkg" https://download.swift.org/swiftly/darwin/swiftly.pkg
          installer -pkg "$RUNNER_TEMP/swiftly.pkg" -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . ~/.swiftly/env.sh
          swiftly install --use --assume-yes 6.4
          {
            echo "SWIFTLY_HOME_DIR=$SWIFTLY_HOME_DIR"
            echo "SWIFTLY_BIN_DIR=$SWIFTLY_BIN_DIR"
            echo "SWIFTLY_TOOLCHAINS_DIR=$SWIFTLY_TOOLCHAINS_DIR"
          } >> "$GITHUB_ENV"
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      # Windows images ship no Swift; install the swift.org release.
      - name: Install Swift 6.4 (Windows)
        if: runner.os == 'Windows'
        uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.3-release
          swift-build: 6.4.3-RELEASE

      - run: swift --version
      - name: Build
        run: swift build
      - name: Run tests
        run: swift test

  conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Static stdlib so the binary runs on the host outside the container.
      - name: Build conformance client
        run: >
          docker run --rm -v "$PWD:/src" -w /src swift:6.4-noble
          swift build -c release --product sigstore-swift-conformance --static-swift-stdlib

      - name: Read expected failures
        id: xfail
        run: echo "list=$(sed -e '/^#/d' .github/conformance-xfail.txt | xargs)" >> "$GITHUB_OUTPUT"

      # Verify-only client: signing tests are skipped, so a staging run
      # (which only has signing tests) is omitted.
      - uses: sigstore/sigstore-conformance@21533cde107c734ebc153c3e3a24d75fc9811a36 # v0.0.29
        with:
          entrypoint: ${{ github.workspace }}/.build/release/sigstore-swift-conformance
          skip-signing: "true"
          xfail: ${{ steps.xfail.outputs.list }}
